name: Build portable Windows package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "portable-v*"
  workflow_dispatch:

jobs:
  build-windows-amd64:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.4"
          cache: true

      - name: Build patched core
        shell: powershell
        run: .\scripts\build-custom-core.ps1

      - name: Download and verify cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath .\runtime\cloudflared\VERSION -Raw).Trim()
          $expected = (Get-Content -LiteralPath .\runtime\cloudflared\SHA256 -Raw).Trim().ToUpperInvariant()
          $destination = '.\runtime\bin\cloudflared.exe'
          $url = "https://github.com/cloudflare/cloudflared/releases/download/$version/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $destination
          $actual = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "cloudflared checksum mismatch: expected $expected, got $actual"
          }

      - name: Assemble portable package
        shell: powershell
        run: .\scripts\build-portable-package.ps1

      - name: Test portable package
        shell: powershell
        run: .\scripts\test-portable-package.ps1

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subs-check-pro-portable-windows-amd64
          path: |
            dist/subs-check-pro-portable-windows-amd64.zip
            dist/subs-check-pro-portable-windows-amd64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-tagged-release:
    if: startsWith(github.ref, 'refs/tags/portable-v')
    needs: build-windows-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: subs-check-pro-portable-windows-amd64
          path: dist

      - name: Publish tagged release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/subs-check-pro-portable-windows-amd64.zip
            dist/subs-check-pro-portable-windows-amd64.zip.sha256
          generate_release_notes: true
